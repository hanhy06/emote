name: Deploy website to GitHub Pages

on:
  push:
    branches: ["**"]
    tags: ["[0-9]*", "v[0-9]*"]
    paths:
      - "web/**"
      - "shared/**"
      - "docs/mkdocs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ (github.ref_type == 'tag' || github.ref_name == 'dev' || github.ref_name == github.event.repository.default_branch) && 'site' || github.ref }}

jobs:
  build:
    if: github.ref_type == 'tag' || github.ref == 'refs/heads/dev' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: refs/heads/${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs/mkdocs/requirements.txt

      - name: Install documentation dependencies
        run: python -m pip install -r docs/mkdocs/requirements.txt

      - name: Build documentation
        env:
          EMOTE_SKIP_CONVERTER: "1"
        run: python -m mkdocs build --strict --config-file docs/mkdocs/mkdocs.yml

      - name: Build converters
        shell: bash
        env:
          PAGES_CONVERTER_REF: ${{ vars.PAGES_CONVERTER_REF }}
        run: |
          mapfile -t tags < <(git tag --sort=refname --sort=-creatordate --list '[0-9]*' 'v[0-9]*')
          if (( ${#tags[@]} < 2 )); then
            echo '::error::Two version tags are required to build the public and legacy converters.'
            exit 1
          fi

          site_dir="$GITHUB_WORKSPACE/docs/mkdocs/site"
          build_converter() {
            local ref="$1" path="$2"
            local checkout="$RUNNER_TEMP/emote-${path//\//-}"
            echo "Building /$path from $ref"
            git worktree add --detach -- "$checkout" "$ref"
            (
              cd "$checkout/web"
              npm ci
              npm run build -- --outDir "$site_dir/$path" --emptyOutDir --base ./
            )
          }

          public_ref="${PAGES_CONVERTER_REF:-refs/tags/${tags[0]}}"
          if [[ "$public_ref" == refs/heads/* ]]; then
            public_ref="refs/remotes/origin/${public_ref#refs/heads/}"
          elif ! git rev-parse --verify --end-of-options "$public_ref^{commit}" >/dev/null 2>&1; then
            public_ref="refs/remotes/origin/$public_ref"
          fi
          build_converter "$public_ref" converter
          build_converter "refs/tags/${tags[1]}" legacy/converter
          build_converter refs/remotes/origin/dev dev/converter

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/mkdocs/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
