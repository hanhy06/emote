name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  mod:
    name: Mod
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: microsoft

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test mod
        run: ./gradlew build

      - name: Upload mod artifacts
        uses: actions/upload-artifact@v4
        with:
          name: emote-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

  website:
    name: Documentation and web converter
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs/mkdocs/requirements.txt

      - name: Install web dependencies
        run: npm ci

      - name: Install documentation dependencies
        run: python -m pip install -r ../docs/mkdocs/requirements.txt

      - name: Build website
        run: python -m mkdocs build --strict --config-file ../docs/mkdocs/mkdocs.yml
