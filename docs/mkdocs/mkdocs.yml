site_name: Emote 문서
site_description: Emote 모드와 웹 변환기 사용 설명서
site_url: https://hanhy06.github.io/emote/

repo_url: https://github.com/hanhy06/emote
repo_name: hanhy06/emote

docs_dir: docs
site_dir: site

hooks:
  - build_converter.py

watch:
  - ../../web/src
  - ../../web/package.json
  - ../../web/vite.config.ts

nav:
  - 홈: index.md
  - 시작하기: getting-started.md
  - 서버 관리: server-management.md
  - 웹 변환기: converter.md
  - 포맷 명세:
      - Animation: formats/animation.md
      - Sequence: formats/sequence.md
  - Mod API: api.md
  - 문제 해결: troubleshooting.md

theme:
  name: material
  language: ko
  palette:
    - scheme: slate
      primary: blue
      accent: blue
  features:
    - navigation.sections
    - navigation.instant
    - navigation.tracking
    - navigation.path
    - navigation.top
    - navigation.indexes
    - toc.integrate
    - toc.follow
    - content.code.copy
    - search.highlight
    - search.suggest
    - search.share
plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
