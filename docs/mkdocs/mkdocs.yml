site_name: Emote 문서
site_description: Emote 서버 운영 및 포맷 문서
site_url: https://hanhy06.github.io/emote/

repo_url: https://github.com/hanhy06/emote
repo_name: hanhy06/emote

docs_dir: docs
site_dir: site

hooks:
  - build_converter.py

watch:
  - ../../web/src
  - ../../web/package.json
  - ../../web/vite.config.ts

nav:
  - 홈: index.md
  - 운영자:
      - 설치와 설정 파일: server/installation.md
      - 권한과 접근 제어: server/access-control.md
      - 쿨다운과 유휴 이모트: server/playback-policy.md
      - 명령어: server/commands.md
      - Sequence 사용: server/sequences.md
  - 개발자:
      - Animation: formats/animation.md
      - Sequence: formats/sequence.md
      - Mod API: api.md

theme:
  name: material
  language: ko
  palette:
    - scheme: slate
      primary: blue
      accent: blue
  features:
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.instant
    - navigation.tracking
    - navigation.path
    - navigation.top
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - search.highlight
    - search.suggest
    - search.share
plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
