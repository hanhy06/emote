site_name: Emote Wiki
site_description: Documentation for the Emote mod and web converter

repo_url: https://github.com/hanhy06/emote
repo_name: hanhy06/emote

docs_dir: docs
site_dir: site

hooks:
  - build_converter.py

watch:
  - ../../web/src
  - ../../web/package.json
  - ../../web/vite.config.ts

theme:
  name: material
  language: en
  palette:
    - scheme: slate
      primary: blue
      accent: blue
  features:
    - navigation.sections
    - navigation.instant
    - navigation.tracking
    - navigation.path
    - navigation.top
    - navigation.indexes
    - toc.integrate
    - toc.follow
    - content.code.copy
    - search.highlight
    - search.suggest
    - search.share
  custom_dir: overrides

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
