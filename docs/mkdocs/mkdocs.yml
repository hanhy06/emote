site_name: Emote Documentation
site_description: Emote server administration and format documentation
site_url: https://hanhy06.github.io/emote/

repo_url: https://github.com/hanhy06/emote
repo_name: hanhy06/emote

docs_dir: docs
site_dir: site

hooks:
  - build_converter.py

watch:
  - ../../web/src
  - ../../web/package.json
  - ../../web/vite.config.ts

nav:
  - Home: index.md
  - Server Administration:
      - Installation: server/installation.md
      - Access Control: server/access-control.md
      - Custom Emote: server/custom-emote.md
      - Advanced Usage: server/advanced-usage.md
      - Performance: server/performance.md
  - Developers:
      - Animation: developers/animation.md
      - Sequence: developers/sequence.md
      - Molang: developers/molang.md
      - Mod API: developers/api.md

theme:
  name: material
  language: en
  palette:
    - scheme: slate
      primary: deep purple
      accent: deep purple
  features:
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.instant
    - navigation.tracking
    - navigation.path
    - navigation.top
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - search.highlight
    - search.suggest
    - search.share
plugins:
  - search

extra_javascript:
  - javascripts/stress-test-chart.js

extra_css:
  - stylesheets/stress-test-chart.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
